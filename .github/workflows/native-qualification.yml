name: Credential custody native qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact proposed source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, source-qualified
        with:
          persist-credentials: false
      - name: Select supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise original native functional, failure and security regressions
        run: npm test
